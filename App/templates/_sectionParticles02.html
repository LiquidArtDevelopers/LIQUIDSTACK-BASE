<section class="sectionParticles02 {classVar}"
  data-section-particles02
  data-bh-black-hole-mass="{black-hole-mass}"
  data-bh-gravitational-lensing="{gravitational-lensing}"
  data-bh-doppler-strength="{doppler-strength}"
  data-bh-disk-inner-radius="{disk-inner-radius}"
  data-bh-disk-outer-radius="{disk-outer-radius}"
  data-bh-disk-brightness="{disk-brightness}"
  data-bh-disk-temperature="{disk-temperature}"
  data-bh-temperature-falloff="{temperature-falloff}"
  data-bh-disk-edge-softness-inner="{disk-edge-softness-inner}"
  data-bh-disk-edge-softness-outer="{disk-edge-softness-outer}"
  data-bh-turbulence-scale="{turbulence-scale}"
  data-bh-turbulence-stretch="{turbulence-stretch}"
  data-bh-turbulence-sharpness="{turbulence-sharpness}"
  data-bh-disk-rotation-speed="{disk-rotation-speed}"
  data-bh-turbulence-cycle-time="{turbulence-cycle-time}"
  data-bh-turbulence-lacunarity="{turbulence-lacunarity}"
  data-bh-turbulence-persistence="{turbulence-persistence}"
  data-bh-stars-enabled="{stars-enabled}"
  data-bh-star-background-color="{star-background-color}"
  data-bh-star-density="{star-density}"
  data-bh-star-size="{star-size}"
  data-bh-star-brightness="{star-brightness}"
  data-bh-nebula-enabled="{nebula-enabled}"
  data-bh-nebula1-scale="{nebula1-scale}"
  data-bh-nebula1-density="{nebula1-density}"
  data-bh-nebula1-brightness="{nebula1-brightness}"
  data-bh-nebula1-color="{nebula1-color}"
  data-bh-nebula2-scale="{nebula2-scale}"
  data-bh-nebula2-density="{nebula2-density}"
  data-bh-nebula2-brightness="{nebula2-brightness}"
  data-bh-nebula2-color="{nebula2-color}"
  data-bh-bloom-strength="{bloom-strength}"
  data-bh-bloom-radius="{bloom-radius}"
  data-bh-bloom-threshold="{bloom-threshold}"
  data-bh-step-size="{step-size}"
  data-bh-star-drift="{star-drift}"
  data-bh-lens-chroma="{lens-chroma}"
  data-bh-hole-x="{hole-x}"
  data-bh-hole-y="{hole-y}"
  data-bh-mouse-influence="{mouse-influence}">
  <canvas class="sectionParticles02-canvas" data-section-particles02-canvas aria-hidden="true"></canvas>

  <div class="sectionParticles02-overlay">
    <article class="sectionParticles02-panel">
      {content}
    </article>
  </div>
</section>
